<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatoire européen des marchés publics · Tableau de bord</title>
<style>
body{margin:0;background:#F4F5F7}
a{color:#1F4FD1}a:hover{color:#163A9C}
.card{background:#FFFFFF;border:1px solid #DDE1E7;border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lbl{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#4A5466}
.big{font-size:34px;font-weight:700;color:#14213D;font-variant-numeric:tabular-nums;line-height:1.05}
.n{font-size:13px;color:#4A5466;font-variant-numeric:tabular-nums}
.chip{font:inherit;font-size:13px;border:1px solid #C9CFD8;background:#FFFFFF;color:#14213D;border-radius:999px;padding:0 14px;min-height:36px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chipon{font:inherit;font-size:13px;border:1.5px solid #1F4FD1;background:#E6ECFC;color:#163A9C;font-weight:600;border-radius:999px;padding:0 14px;min-height:36px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fix{font-size:11px;font-weight:600;color:#163A9C;border:1px solid #9DB2EE;background:#F1F4FD;border-radius:4px;padding:1px 6px;white-space:nowrap}
.alert{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#8A3600;background:#FFF3EA;border-radius:6px;padding:8px 10px}
.ok{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#2B3445;background:#F1F3F6;border-radius:6px;padding:8px 10px}
.link{font:inherit;font-size:13px;font-weight:600;color:#1F4FD1;background:none;border:none;padding:0;min-height:32px;cursor:pointer;text-align:left}
.track{position:relative;height:14px;background:#EEF0F4;border-radius:3px}
.th{font-size:12px;font-weight:600;color:#4A5466;text-align:left;padding:8px 10px;border-bottom:1px solid #DDE1E7;white-space:nowrap}
.td{font-size:13px;color:#14213D;padding:8px 10px;border-bottom:1px solid #EEF0F4;font-variant-numeric:tabular-nums;white-space:nowrap}
.ph{color:#6B7486;font-style:italic}
button:focus-visible,a:focus-visible{outline:3px solid #1F4FD1;outline-offset:2px;border-radius:6px}
html{scroll-behavior:smooth;scroll-padding-top:80px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes slide{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.card{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,33,61,.10)}
main > div > div > *:nth-child(2) .card,main > div > div > *:nth-child(2){animation-delay:.05s}
main > div > div > *:nth-child(3) .card,main > div > div > *:nth-child(3){animation-delay:.12s}
main > div > div > *:nth-child(4) .card,main > div > div > *:nth-child(4){animation-delay:.19s}
main > div > div > *:nth-child(5) .card,main > div > div > *:nth-child(5){animation-delay:.26s}
main > div > div > *:nth-child(6) .card,main > div > div > *:nth-child(6){animation-delay:.33s}
main > div > div > *:nth-child(7) .card,main > div > div > *:nth-child(7){animation-delay:.40s}
section[aria-label="En bref"] > button{transition:transform .2s ease,box-shadow .2s ease}section[aria-label="En bref"] > button:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,33,61,.25)}
section[aria-label="En bref"] > *{animation:slide .6s cubic-bezier(.2,.8,.2,1) both}
section[aria-label="En bref"] > *:nth-child(2){animation-delay:.1s}
section[aria-label="En bref"] > *:nth-child(3){animation-delay:.2s}
.track > div[style*="left: 0"],.track > div[style*="left:0"]{transform-origin:left center;animation:grow 1s cubic-bezier(.2,.8,.2,1) .25s both}
[style*="border-radius:50%"],[style*="border-radius: 50%"]{animation:pop .5s ease .7s both}
[style*="height:2px;background"]{transform-origin:center;animation:grow .7s ease .45s both}
.alert svg{animation:pulse 2.2s ease-in-out 1.2s infinite}
.big{animation:rise .6s ease .15s both}
.chip,.chipon,.link{transition:background .15s ease,border-color .15s ease,color .15s ease,transform .15s ease}
.chip:hover{background:#F1F4FD;border-color:#9DB2EE;transform:translateY(-1px)}
.link:hover{transform:translateX(3px)}
nav button{transition:border-color .25s ease,background .15s ease}
nav button:hover{background:#F4F6FB}
article.card:nth-child(2){animation-delay:.08s}article.card:nth-child(3){animation-delay:.16s}article.card:nth-child(4){animation-delay:.24s}article.card:nth-child(5){animation-delay:.32s}article.card:nth-child(6){animation-delay:.40s}article.card:nth-child(7){animation-delay:.48s}
tbody tr{animation:rise .45s ease both}tbody tr:nth-child(2){animation-delay:.08s}tbody tr:nth-child(3){animation-delay:.16s}tbody tr:nth-child(4){animation-delay:.24s}
#seg-reco{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
h1{animation:slide .5s ease both}
.chatpanel{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.chatfab{transition:transform .2s ease}.chatfab:hover{transform:translateY(-2px) scale(1.03)}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-4px)}}
.chatfab{animation:nudge 2.4s ease-in-out 2s 3}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

.still *{animation:none !important}
@media (max-width: 900px){main [style*="grid-template-columns: 150px"]{grid-template-columns:1fr !important}main [style*="grid-column: span 2"]{grid-column:auto !important;grid-template-columns:1fr !important}main [style*="repeat(3, minmax(0, 1fr))"],main [style*="repeat(4, minmax(0, 1fr))"],main [style*="repeat(2, minmax(0, 1fr))"]{grid-template-columns:1fr !important}}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #14213D; min-height: 100vh; display: flex; flex-direction: column">

<header style="background: #14213D; color: #FFFFFF; padding: 16px 32px; display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'IBM Plex Sans Condensed', sans-serif; font-size: 22px; font-weight: 600">Observatoire européen des marchés publics</div>
<div style="font-size: 13px; color: #C5CDE0">Fichier principal dédoublonné · 149 813 attributions (336 doublons retirés) · 33 pays</div>
</div>
<div style="display: flex; align-items: center; gap: 10px; background: #22325A; border-radius: 8px; padding: 8px 12px; font-size: 13px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFC9A3" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<span>Données 2009-2017 · dernière année disponible : 2017 · suivi annuel</span>
</div>
</header>

<nav aria-label="Vues du tableau de bord" style="background: #FFFFFF; border-bottom: 1px solid #DDE1E7; padding: 0 32px; display: flex; flex-wrap: wrap; gap: 4px; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 8px rgba(20,33,61,.06)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button onClick="{{t.go}}" style="{{t.style}}">
<span style="font-size: 15px; font-weight: 600">{{t.label}}</span>
<span style="font-size: 12px; color: #4A5466">{{t.q}}</span>
</button>
</sc-for>
</nav>

<main style="flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; box-sizing: border-box; padding: 24px 32px 48px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between">
<sc-if value="{{canBack}}" hint-placeholder-val="{{false}}"><button onClick="{{goBack}}" class="chip" aria-label="Retour à l'écran précédent" style="align-self: center; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>Retour</button></sc-if>
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 240px"><h1 style="margin: 0; font-family: 'IBM Plex Sans Condensed', sans-serif; font-size: 26px; font-weight: 600">{{view.title}}</h1><span style="font-size: 14px; color: #4A5466">{{view.sub}}</span></div>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><span style="font-size: 12px; font-weight: 600; background: #14213D; color: #FFFFFF; border-radius: 999px; padding: 5px 12px">Pour : {{view.who}}</span><span style="font-size: 12px; font-weight: 600; background: #FFFFFF; border: 1px solid #C9CFD8; border-radius: 999px; padding: 4px 12px">Décision : {{view.decision}}</span></div>
</div>

<!-- ============ VUE 1 ============ -->
<sc-if value="{{isV1}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: #FFFFFF; border: 1px solid #DDE1E7; border-radius: 10px; padding: 12px 16px">
<span class="lbl" style="margin-right: 4px">Filtres de contexte</span>
<sc-for list="{{fv1}}" as="f" hint-placeholder-count="4"><button class="{{f.cls}}" onClick="{{f.toggle}}" aria-expanded="{{f.open}}">{{f.text}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></sc-for>
<div style="flex: 1"></div>
<span style="font-size: 13px; color: #4A5466">Seuil d'alerte offre unique</span>
<sc-for list="{{seuils}}" as="s" hint-placeholder-count="3">
<button class="{{s.cls}}" onClick="{{s.go}}">{{s.label}}</button>
</sc-for>
</div>

<sc-if value="{{panel.show}}" hint-placeholder-val="{{false}}">
<div class="card" style="padding: 14px 16px; gap: 10px; animation-duration: .25s">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span class="lbl">{{panel.title}}</span><button class="link" onClick="{{closePanel}}">Fermer</button></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{panel.options}}" as="o" hint-placeholder-count="6"><button class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
</div>
</sc-if>
<sc-if value="{{hasActive}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; background: #E6ECFC; color: #163A9C; border-radius: 8px; padding: 10px 14px">
<b>Sélection active :</b><span>{{activeText}}</span><button class="link" onClick="{{resetFilters}}">Réinitialiser</button>
<span style="color: #2B3445">Maquette : les chiffres affichés sont ceux de l'ensemble ; dans Power BI chaque indicateur se recalcule sur la sélection, avec « effectif insuffisant » sous le seuil.</span>
</div>
</sc-if>
<section aria-label="En bref" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<button onClick="{{goV3}}" class="brief" style="font: inherit; text-align: left; cursor: pointer; border: none; background: #14213D; color: #FFFFFF; border-radius: 10px; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #C5CDE0; font-weight: 600; letter-spacing: .04em; text-transform: uppercase">A · Concurrence</span>
<span style="font-size: 16px; font-weight: 600">{{seuilCount}} segments pays × secteur dépassent {{seuil}} % d'offre unique</span>
<span style="font-size: 12px; color: #C5CDE0">Voir le détail →</span>
</button>
<button onClick="{{goV3b}}" class="brief" style="font: inherit; text-align: left; cursor: pointer; border: none; background: #14213D; color: #FFFFFF; border-radius: 10px; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #C5CDE0; font-weight: 600; letter-spacing: .04em; text-transform: uppercase">B · Accès des PME (2016-2017)</span>
<span style="font-size: 16px; font-weight: 600">4 pays sous 40 % de PME : NO, ES, IT, AT</span>
<span style="font-size: 12px; color: #C5CDE0">Voir le détail →</span>
</button>
<button onClick="{{goV4z}}" class="brief" style="font: inherit; text-align: left; cursor: pointer; border: none; background: #14213D; color: #FFFFFF; border-radius: 10px; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #C5CDE0; font-weight: 600; letter-spacing: .04em; text-transform: uppercase">C · Budget</span>
<span style="font-size: 16px; font-weight: 600">0,33 % des marchés portent 36,6 % du montant</span>
<span style="font-size: 12px; color: #C5CDE0">Voir le détail →</span>
</button>
</section>
<div style="display: flex; justify-content: flex-end; margin-top: -6px"><button class="link" onClick="{{goV3}}" style="font-size: 14px">Que faire ? Voir les 7 préconisations →</button></div>

<!-- Axe A -->
<div style="display: grid; grid-template-columns: 150px repeat(2, minmax(0, 1fr)); gap: 14px; align-items: stretch">
<div style="display: flex; flex-direction: column; justify-content: center; gap: 4px">
<span style="font-size: 18px; font-weight: 700">Axe A</span><span style="font-size: 13px; color: #4A5466">Concurrence</span>
<span style="font-size: 12px; color: #4A5466">2009-2017 · procédure ouverte</span>
</div>
<div class="card">
<div style="display: flex; justify-content: space-between; gap: 8px"><span class="lbl">1 · Taux d'offre unique</span><span class="n">indicateur</span></div>
<div style="display: flex; align-items: baseline; gap: 10px"><span class="big">27,7 %</span><span class="n">32 573 / 117 473 marchés · sentinelle 940 et NOC exclues</span></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div class="track"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: 27.7%; background: #1F4FD1; border-radius: 3px"></div><div style="{{seuilMarker}}"></div></div>
<div style="display: flex; justify-content: space-between" class="n"><span>0 %</span><span>repère {{seuil}} %</span><span>100 %</span></div>
</div>
<div class="alert"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B34700" stroke-width="2" aria-hidden="true"><path d="M12 3 2 21h20L12 3z"></path><path d="M12 10v5M12 18v.5"></path></svg><span><b>{{seuilCount}} segments</b> au-dessus de {{seuil}} % (sur 149 publiables, ≥ 100 marchés) → entrent dans les 20 dossiers</span></div>
<div style="display: flex; gap: 16px; flex-wrap: wrap"><button class="link" onClick="{{goV2R1}}">Pourquoi ? → relation R1</button><button class="link" onClick="{{goV3}}">Voir les segments →</button></div>
</div>
<div class="card">
<div style="display: flex; justify-content: space-between; gap: 8px"><span class="lbl">2 · Médiane des offres</span><span class="n">agrégat non additif</span></div>
<div style="display: flex; align-items: baseline; gap: 10px"><span class="big">3 offres</span><span class="n">mêmes 117 473 marchés</span></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div class="track" style="background: linear-gradient(90deg, #FFE3D0 0 20%, #EEF0F4 20% 100%)"><div style="position: absolute; left: 30%; top: -3px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: #1F4FD1; border: 2px solid #FFFFFF; box-sizing: border-box"></div><div style="position: absolute; left: 20%; top: -4px; bottom: -4px; width: 2px; background: #B34700"></div></div>
<div style="display: flex; justify-content: space-between" class="n"><span>0</span><span>repère 2</span><span>10 offres</span></div>
</div>
<div class="alert"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B34700" stroke-width="2" aria-hidden="true"><path d="M12 3 2 21h20L12 3z"></path><path d="M12 10v5M12 18v.5"></path></svg><span><b>47 segments</b> à médiane ≤ 2 (≥ 100 marchés) → liste de surveillance</span></div>
<button class="link" onClick="{{goV3}}">Voir la liste de surveillance →</button>
</div>
</div>

<!-- Axe B -->
<div style="display: grid; grid-template-columns: 150px repeat(2, minmax(0, 1fr)); gap: 14px; align-items: stretch">
<div style="display: flex; flex-direction: column; justify-content: center; gap: 4px">
<span style="font-size: 18px; font-weight: 700">Axe B</span><span style="font-size: 13px; color: #4A5466">Accès des PME</span>
</div>
<div style="grid-column: span 2; border: 1.5px dashed #9DB2EE; border-radius: 12px; padding: 34px 12px 12px; position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; background: #F8FAFE">
<div style="position: absolute; top: 8px; left: 14px; display: flex; gap: 8px; align-items: center"><span style="font-size: 12px; font-weight: 700; color: #163A9C">FENÊTRE 2016-2017 VERROUILLÉE · le filtre Année ne s'applique pas</span></div>
<sc-if value="{{yearIgnored}}" hint-placeholder-val="{{false}}"><div class="ok" style="grid-column: span 2"><span>Filtre Année = {{f.annee}} ignoré ici : la variable PME n'existe pas avant 2016. Ces deux blocs restent sur 2016-2017, jamais à 0 %.</span></div></sc-if>
<div class="card">
<div style="display: flex; justify-content: space-between; gap: 8px"><span class="lbl">3 · Part de PME</span><span class="n">indicateur</span></div>
<div style="display: flex; align-items: baseline; gap: 10px"><span class="big">53,7 %</span><span class="n">11 504 / 21 421 marchés renseignés · 21 pays publiables</span></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div class="track"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: 53.7%; background: #1F4FD1; border-radius: 3px"></div><div style="position: absolute; left: 40%; top: -4px; bottom: -4px; width: 2px; background: #B34700"></div></div>
<div style="display: flex; justify-content: space-between" class="n"><span>0 %</span><span>repère 40 %</span><span>100 %</span></div>
</div>
<div class="alert"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B34700" stroke-width="2" aria-hidden="true"><path d="M12 3 2 21h20L12 3z"></path><path d="M12 10v5M12 18v.5"></path></svg><span><b>4 pays sous 40 %</b> : NO, ES, IT, AT (≥ 100 marchés) → revue d'allotissement</span></div>
<div style="display: flex; gap: 16px; flex-wrap: wrap"><button class="link" onClick="{{goV2R3}}">Pourquoi ? → relation R3</button><button class="link" onClick="{{goV3}}">Voir les pays →</button></div>
</div>
<div class="card">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: center"><span class="lbl">4 · Gain simulé du 6-10 lots</span></div>
<div style="display: flex; align-items: baseline; gap: 10px"><span class="big">+5,3 pts</span><span class="n">France seule · [+1,4 ; +9,2]</span></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div class="track" style="background: #EEF0F4"><div style="position: absolute; left: 14%; width: 78%; top: 6px; height: 2px; background: #1F4FD1"></div><div style="position: absolute; left: 53%; top: -3px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: #1F4FD1; border: 2px solid #FFFFFF; box-sizing: border-box"></div><div style="position: absolute; left: 0; top: -4px; bottom: -4px; width: 2px; background: #4A5466"></div></div>
<div style="display: flex; justify-content: space-between" class="n"><span>0 pt</span><span>+5</span><span>+10 pts</span></div>
</div>
<div class="n">Base France non-allotis 41,2 % (154 / 374) · RC ajusté 1,24 [1,06 ; 1,45]</div>
<div class="alert"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B34700" stroke-width="2" aria-hidden="true"><path d="M12 3 2 21h20L12 3z"></path><path d="M12 10v5M12 18v.5"></path></svg><span><b>France sous 45 %</b> de PME parmi ses non-allotis → candidate au 6-10 lots, recommandation suspendue (voir vue 2)</span></div>
<div class="ok"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5466" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v.5M12 11v6"></path></svg><span>Allemagne 59,5 % et Royaume-Uni 60,5 % de PME : au-dessus du seuil, et effet inversé (RC 0,60 et 0,50), <b>gain non affiché</b>. Ensemble des pays : +5,4 pts [+1,5 ; +9,2] sur une base de 49,9 % (609 / 1 221), en référence. 4 106 marchés à lots inconnus exclus.</span></div>
<button class="link" onClick="{{goV2R3}}">Pourquoi et à quel prix ? → R3 →</button>
</div>
</div>
</div>

<!-- Axe C -->
<div style="display: grid; grid-template-columns: 150px repeat(2, minmax(0, 1fr)); gap: 14px; align-items: stretch">
<div style="display: flex; flex-direction: column; justify-content: center; gap: 4px">
<span style="font-size: 18px; font-weight: 700">Axe C</span><span style="font-size: 13px; color: #4A5466">Budget</span>
<span style="font-size: 12px; color: #4A5466">2009-2017</span>
</div>
<div class="card">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: center"><span class="lbl">5 · Montant total pondéré</span><span class="n">Σ montant × POIDS</span></div>
<div style="display: flex; align-items: baseline; gap: 10px"><span class="big">3 213 Md€</span><span class="n">médiane par attribution 45 781 € · 96 segments publiables</span></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{montants}}" as="m" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 130px minmax(0, 1fr) 120px; gap: 8px; align-items: center">
<span style="font-size: 13px">{{m.label}}</span>
<div class="track"><div style="{{m.bar}}"></div></div>
<span class="n">{{m.pct}} ({{m.n}})</span>
